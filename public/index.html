<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشاركة الموقع</title><style>body{font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:20px;line-height:1.7}button{padding:13px 18px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px}#out{margin-top:18px;padding:15px;background:#f3f3f3;border-radius:12px}</style><h1>مشاركة الموقع</h1><p>بالضغط على الزر أدناه، سيطلب المتصفح إذنك لمشاركة موقعك الجغرافي. عند السماح، سيتم إرسال الإحداثيات إلى صاحب هذه الصفحة.</p><button id="btn">السماح بمشاركة موقعي</button><div id="out"></div><script>const out=document.getElementById('out');document.getElementById('btn').onclick=()=>{if(!navigator.geolocation){out.textContent='هذا المتصفح لا يدعم تحديد الموقع.';return}out.textContent='جاري طلب الإذن...';navigator.geolocation.getCurrentPosition(async p=>{const x=p.coords;try{await fetch('/api/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:x.latitude,longitude:x.longitude,accuracy:x.accuracy})});out.innerHTML='تمت مشاركة موقعك بنجاح.'}catch(e){out.textContent='تعذر إرسال الموقع.'}},e=>{out.textContent='لم تتم مشاركة الموقع: '+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}</script></html>
