<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>لوحة الإدارة</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 9px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #111;
      color: white;
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
      background: #f3f3f3;
      padding: 15px;
      border-radius: 12px;
    }

    a {
      display: block;
      padding: 13px;
      background: #eee;
      color: #111;
      text-decoration: none;
      text-align: center;
      border-radius: 9px;
      margin-top: 15px;
    }

  </style>

</head>

<body>

  <h1>لوحة الإدارة</h1>

  <p>
    أدخل رمز الإدارة لعرض آخر موقع تمت مشاركته.
  </p>

  <input
    id="token"
    type="password"
    placeholder="Admin token"
    autocomplete="off"
  >

  <button id="load">
    تحديث
  </button>

  <pre id="out">
لم يتم طلب الموقع بعد.
  </pre>

  <div id="map"></div>

  <script>

    const tokenInput =
      document.getElementById('token');

    const out =
      document.getElementById('out');

    const map =
      document.getElementById('map');

    document
      .getElementById('load')
      .addEventListener('click', loadLocation);

    async function loadLocation() {

      const token =
        tokenInput.value.trim();

      map.innerHTML = '';

      if (!token) {

        out.textContent =
          'أدخل رمز الإدارة أولاً.';

        return;
      }

      out.textContent =
        'جاري جلب آخر موقع...';

      try {

        const response =
          await fetch(
            '/api/location?token=' +
            encodeURIComponent(token)
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error || 'حدث خطأ.'
          );

        }

        if (data.message) {

          out.textContent =
            data.message;

          return;
        }

        out.textContent =
          'Latitude: ' +
          data.latitude +
          '\nLongitude: ' +
          data.longitude +
          '\nAccuracy: ±' +
          Math.round(data.accuracy) +
          ' m' +
          '\nReceived: ' +
          data.receivedAt;

        const url =
          'https://www.openstreetmap.org/?mlat=' +
          data.latitude +
          '&mlon=' +
          data.longitude +
          '#map=17/' +
          data.latitude +
          '/' +
          data.longitude;

        map.innerHTML =
          '<a href="' +
          url +
          '" target="_blank" rel="noopener">' +
          '📍 فتح الموقع على الخريطة' +
          '</a>';

      } catch (error) {

        out.textContent =
          error.message;

      }

    }

  </script>

</body>

</html>
