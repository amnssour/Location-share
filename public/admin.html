
<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الموقع</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px}input,button{padding:12px;border-radius:9px;border:1px solid #ccc}button{background:#111;color:#fff;cursor:pointer}#map{margin-top:20px;width:100%;height:320px;border:0;border-radius:12px}pre{white-space:pre-wrap}</style><h1>لوحة الموقع</h1><p>أدخل رمز الإدارة ثم اضغط تحديث.</p><input id="token" type="password" placeholder="Admin token"><button onclick="load()">تحديث</button><pre id="out"></pre><div id="map"></div><script>async function load(){const t=document.getElementById('token').value;const o=document.getElementById('out');try{const r=await fetch('/api/location?token='+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.error);if(d.message){o.textContent=d.message;return}o.textContent=`Latitude: ${d.latitude}\nLongitude: ${d.longitude}\nAccuracy: ±${Math.round(d.accuracy)} m\nReceived: ${d.receivedAt}`;document.getElementById('map').innerHTML=`<a target="_blank" href="https://www.openstreetmap.org/?mlat=${d.latitude}&mlon=${d.longitude}#map=17/${d.latitude}/${d.longitude}">فتح الموقع على OpenStreetMap</a>`}catch(e){o.textContent=e.message}}</script></html>
